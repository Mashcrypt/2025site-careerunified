<!DOCTYPE html>
<html lang="en">
<head>
<title>{{title}} – {{company}} | Career Unified</title>

<meta name="description" content="{{title}} at {{company}} in {{location}}. Salary: {{salary}}. Apply before {{deadline}}">

<meta property="og:type" content="website">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{title}} at {{company}} in {{location}}">
<meta property="og:image" content="{{logo}}">
<meta property="og:url" content="https://careerunified.com/jobs/{{slug}}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{title}} at {{company}}">
<meta name="twitter:image" content="{{logo}}">

<meta http-equiv="refresh" content="0; url=/jobs.html?job={{id}}">
</head>

<body>
<h1>{{title}}</h1>
<p>{{company}}</p>
<p>{{location}}</p>
<p>{{salary}}</p>
<p>{{deadline}}</p>
</body>
</html>
