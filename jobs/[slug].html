<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{job.title}} | CareerUnified</title>
<meta name="description" content="{{job.description}}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f7f9fc;
  margin: 0;
  padding: 0;
}
.container {
  max-width: 800px;
  margin: 40px auto;
  background: white;
  padding: 30px;
  border-radius: 10px;
}
h1 { color: #0b1f44; }
.company { font-size: 18px; color: #555; }
.badge {
  display: inline-block;
  background: #0b1f44;
  color: white;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 14px;
}
.apply {
  display: inline-block;
  margin-top: 20px;
  background: #00b67a;
  color: white;
  padding: 14px 25px;
  border-radius: 6px;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>

<body>
<div class="container">
  <h1 id="title"></h1>
  <div class="company" id="company"></div>
  <br>
  <span class="badge" id="type"></span>
  <p><strong>Location:</strong> <span id="location"></span></p>
  <p><strong>Salary:</strong> <span id="salary"></span></p>
  <p><strong>Closing Date:</strong> <span id="closing"></span></p>

  <hr>

  <div id="description"></div>

  <a id="apply" class="apply" target="_blank">Apply Now</a>
</div>

<script>
const slug = window.location.pathname.split("/").pop()

const query = encodeURIComponent(`*[_type=="job" && slug.current=="${slug}"][0]{
  title,
  description,
  location,
  salary,
  posted,
  deadline,
  jobType,
  applyLink,
  "company": company->name
}`)

fetch("https://qjg5raj1.api.sanity.io/v2024-01-01/data/query/production?query=" + query)
.then(res => res.json())
.then(data => {
  const job = data.result

  if (!job) {
    document.body.innerHTML = "<h2>Job not found</h2>"
    return
  }

  document.getElementById("title").textContent = job.title
  document.getElementById("company").textContent = job.company
  document.getElementById("type").textContent = job.jobType || "Full-time"
  document.getElementById("location").textContent = job.location || "South Africa"
  document.getElementById("salary").textContent = job.salary || "Market related"
  document.getElementById("closing").textContent = job.deadline || "Open until filled"
  document.getElementById("description").innerHTML = job.description
  document.getElementById("apply").href = job.applyLink

  document.title = job.title + " | CareerUnified"
})
</script>

</body>
</html>
