<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{job.title}} | CareerUnified</title>
<meta name="description" content="{{job.description}}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2Z934XRVXT"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag("js", new Date());
gtag("config", "G-2Z934XRVXT", { send_page_view: true });
</script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f7f9fc;
  margin: 0;
  padding: 0;
}
.container {
  max-width: 800px;
  margin: 40px auto;
  background: white;
  padding: 30px;
  border-radius: 10px;
}
h1 { color: #0b1f44; }
.company { font-size: 18px; color: #555; }
.badge {
  display: inline-block;
  background: #0b1f44;
  color: white;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 14px;
}
.apply {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: #00b67a;
  color: white;
  padding: 14px 25px;
  border-radius: 6px;
  text-decoration: none;
  font-weight: bold;
  border: 0;
  cursor: pointer;
  text-align: center;
}
.actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}
.ai-tailor {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: #00b67a;
  color: white;
  padding: 14px 25px;
  border-radius: 6px;
  text-decoration: none;
  font-weight: bold;
  border: 0;
  cursor: pointer;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0, 182, 122, 0.22);
}
.external-link-symbol {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  stroke-width: 2.4;
  fill: none;
  flex-shrink: 0;
}
.ai-tailor-symbol {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  flex-shrink: 0;
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(11, 31, 68, 0.55);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 50;
}
.modal-backdrop.open {
  display: flex;
}
.modal {
  max-width: 440px;
  width: 100%;
  background: white;
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 24px 60px rgba(11, 31, 68, 0.28);
}
.modal h2 {
  margin: 0 0 10px;
  color: #0b1f44;
}
.modal p {
  color: #4b5563;
  line-height: 1.5;
}
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 22px;
}
.modal-actions button {
  border: 0;
  border-radius: 6px;
  padding: 11px 16px;
  font-weight: bold;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.cancel {
  background: #eef2f7;
  color: #0b1f44;
}
.continue {
  background: #00b67a;
  color: white;
}
@media (max-width: 640px) {
  .actions {
    flex-direction: column;
  }
  .apply,
  .ai-tailor {
    width: 100%;
  }
  .modal-actions {
    flex-direction: column-reverse;
  }
  .modal-actions button {
    width: 100%;
  }
}
</style>
</head>

<body>
<div class="container">
  <h1 id="title"></h1>
  <div class="company" id="company"></div>
  <br>
  <span class="badge" id="type"></span>
  <p><strong>Location:</strong> <span id="location"></span></p>
  <p><strong>Salary:</strong> <span id="salary"></span></p>
  <p><strong>Closing Date:</strong> <span id="closing"></span></p>

  <hr>

  <div id="description"></div>

  <div class="actions">
    <button id="apply" class="apply" type="button">
      Apply Now
      <svg class="external-link-symbol" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14 4h6v6"/>
        <path d="M20 4 10 14"/>
        <path d="M20 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4"/>
      </svg>
    </button>
    <button id="aiTailor" class="ai-tailor" type="button">
      <svg class="ai-tailor-symbol" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5a2 2 0 0 0 1.437 1.437l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
        <path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/>
      </svg>
      AI Tailor CV
    </button>
  </div>
</div>

<script>
const slug = window.location.pathname.split("/").pop()
let currentJob = null
let currentApplyLink = ""

const query = encodeURIComponent(`*[_type=="job" && slug.current=="${slug}"][0]{
  _id,
  title,
  slug,
  description,
  location,
  salary,
  posted,
  deadline,
  deadlineText,
  jobType,
  applyLink,
  "company": company->name
}`)

fetch("https://qjg5raj1.api.sanity.io/v2024-01-01/data/query/production?query=" + query)
.then(res => res.json())
.then(data => {
  const job = data.result
  currentJob = job

  if (!job) {
    document.body.innerHTML = "<h2>Job not found</h2>"
    return
  }

  document.getElementById("title").textContent = job.title
  document.getElementById("company").textContent = job.company
  document.getElementById("type").textContent = job.jobType || "Full-time"
  document.getElementById("location").textContent = job.location || "South Africa"
  document.getElementById("salary").textContent = job.salary || "Market related"
  document.getElementById("closing").textContent = job.deadlineText || job.deadline || "Open until filled"
  document.getElementById("description").innerHTML = job.description
  currentApplyLink = job.applyLink || ""

  document.title = job.title + " | CareerUnified"
})

const applyButton = document.getElementById("apply")
const aiTailorButton = document.getElementById("aiTailor")

function trackCroEvent(name, params = {}, callback) {
  if (typeof window.gtag !== "function") {
    if (typeof callback === "function") callback()
    return
  }

  if (typeof callback !== "function") {
    window.gtag("event", name, params)
    return
  }

  let completed = false
  const done = () => {
    if (completed) return
    completed = true
    callback()
  }

  window.gtag("event", name, {
    ...params,
    event_callback: done,
    event_timeout: 700
  })
  window.setTimeout(done, 750)
}

function jobAnalytics(job) {
  return {
    job_id: job?._id || undefined,
    job_title: job?.title || getDisplayedText("title") || undefined,
    job_company: job?.company || getDisplayedText("company") || undefined,
    job_source: "sanity_detail",
    job_slug: job?.slug?.current || slug || undefined
  }
}

function openExternalApply() {
  if (currentApplyLink) {
    window.open(currentApplyLink, "_blank", "noopener,noreferrer")
  }
}

function getDisplayedText(id) {
  const element = document.getElementById(id)
  return element ? element.textContent.trim() : ""
}

function buildJobDescriptionPayload() {
  const title = getDisplayedText("title")
  const company = getDisplayedText("company")
  const location = getDisplayedText("location")
  const salary = getDisplayedText("salary")
  const closingDate = getDisplayedText("closing")
  const description = getDisplayedText("description")
  const fullText = [
    `Job Title: ${title}`,
    `Company: ${company}`,
    `Location: ${location}`,
    salary ? `Salary: ${salary}` : "",
    closingDate ? `Closing Date: ${closingDate}` : "",
    "",
    "Job Description:",
    description,
  ].filter((line, index, lines) => line || lines[index - 1]).join("\n")

  return {
    title,
    company,
    location,
    salary,
    closingDate,
    description,
    fullText,
  }
}

applyButton.addEventListener("click", openExternalApply)
aiTailorButton.addEventListener("click", () => {
  if (!currentJob) return
  sessionStorage.setItem("careerUnifiedAITailorJob", JSON.stringify(buildJobDescriptionPayload()))
  const analytics = {
    ...jobAnalytics(currentJob),
    event_category: "conversion_funnel",
    funnel_step: "job_to_ai_tailor",
    placement: "job_detail_page",
    button_text: "AI Tailor CV"
  }
  trackCroEvent("ai_tailor_start", analytics)
  trackCroEvent("ai_cv_tailor_click", analytics, () => {
    window.location.href = "/cv-generator/?tab=ai&source=job"
  })
})
</script>

<script src="/js/cookie-notice.js"></script>
</body>
</html>
