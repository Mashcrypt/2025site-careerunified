[build]
  publish = "."
  command = "npm run build"

# ================================
# CV GENERATOR (NO REDIRECT LOOPS)
# ================================

[[redirects]]
  from = "/cv-generator.html"
  to = "/cv-generator"
  status = 301
  force = true

[[redirects]]
  from = "/cv-generator"
  to = "/cv-generator/index.html"
  status = 200

[[redirects]]
  from = "/cv-generator/"
  to = "/cv-generator/index.html"
  status = 200

# ================================
# JOBS (Edge Function + SPA)
# ================================

[[edge_functions]]
  function = "job"
  path = "/jobs/*"

[[redirects]]
  from = "/jobs/*"
  to = "/jobs.html"
  status = 200
  force = true

# ================================
# BURSARIES (Edge Function + SPA)
# ================================
# STEP 3 IMPLEMENTED:
# - Edge function path must match the slug route you SHARE on WhatsApp
# - And the function name must match the edge function filename
#   netlify/edge-functions/bursary-og.ts  => function = "bursary-og"
# - Use /bursary/* so it catches /bursary/<slug> (NOT just /bursary?slug=...)

[[edge_functions]]
  function = "bursary-og"
  path = "/bursary/*"

# Humans always land on bursaries.html (SPA), keeping the same pretty URL
[[redirects]]
  from = "/bursary/*"
  to = "/bursaries.html"
  status = 200
  force = true

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# ================================
# Pdf export
# ================================
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["puppeteer-core", "@sparticuz/chromium"]

[functions."export-pdf"]
  memory = 1024
  timeout = 26


