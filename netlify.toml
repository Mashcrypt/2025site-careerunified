# ================================
# CACHE HEADERS — speeds up SEO
# crawl and improves Core Web Vitals
# ================================

# Static assets: cache 1 year
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# CSS/JS: cache 1 week (you may update these)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML pages: always revalidate (important for fresh SEO content)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/guides/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sitemap + robots: short cache so Google sees updates fast
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ================================
# PDF EXPORT FUNCTION
# ================================
[functions]
  node_bundler = "esbuild"

[functions."export-pdf"]
  external_node_modules = ["puppeteer-core", "@sparticuz/chromium"]
  memory = 1024
  timeout = 26

[functions."ai-tailor"]
  timeout = 26

[functions."payfast-itn"]
  timeout = 26
# ================================
# FOR AUTONOMUS EMAIL FUNCTION
# ================================

[functions."daily-job-draft"]
