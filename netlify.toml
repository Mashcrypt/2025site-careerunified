# ================================
# BUILD
# ================================
[build]
  publish = "."
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# ================================
# SECURITY + SEO HEADERS
# ================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob: https:; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://www.gstatic.com https://apis.google.com https://www.googletagmanager.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://qjg5raj1.api.sanity.io https://*.sanity.io https://generativelanguage.googleapis.com https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com; frame-src 'self' https://*.firebaseapp.com https://apis.google.com https://accounts.google.com; form-action 'self' https:; upgrade-insecure-requests"

# ================================
# CANONICAL: /index.html → /
# Prevents duplicate content penalty
# ================================
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Static browser-only admin panels are not safe to expose publicly.
[[redirects]]
  from = "/admin.html"
  to = "/"
  status = 404

[[redirects]]
  from = "/admin-dashboard.html"
  to = "/"
  status = 404

[[redirects]]
  from = "/sanity/*"
  to = "/"
  status = 404

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# ================================
# TRAILING SLASH NORMALISATION
# Prevents duplicate URLs for SEO
# ================================
[[redirects]]
  from = "/jobs/"
  to = "/jobs.html"
  status = 301

[[redirects]]
  from = "/bursaries/"
  to = "/bursaries.html"
  status = 301

[[redirects]]
  from = "/varsity/"
  to = "/varsity.html"
  status = 301

[[redirects]]
  from = "/about-us/"
  to = "/about-us.html"
  status = 301

[[redirects]]
  from = "/contact-us/"
  to = "/contact-us.html"
  status = 301

[[redirects]]
  from = "/privacy/"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/terms/"
  to = "/terms.html"
  status = 301

[[redirects]]
  from = "/cv-tips"
  to = "/cv-tips.html"
  status = 200

[[redirects]]
  from = "/cv-tips/"
  to = "/cv-tips.html"
  status = 200

[[redirects]]
  from = "/z83-filler"
  to = "/z83-filler.html"
  status = 200

[[redirects]]
  from = "/z83-filler/"
  to = "/z83-filler.html"
  status = 200

# ================================
# CV GENERATOR (NO REDIRECT LOOPS)
# ================================
[[redirects]]
  from = "/cv-generator.html"
  to = "/cv-generator"
  status = 301
  force = true

[[redirects]]
  from = "/cv-generator"
  to = "/cv-generator/index.html"
  status = 200

[[redirects]]
  from = "/cv-generator/"
  to = "/cv-generator/index.html"
  status = 200

# ================================
# JOBS (Edge Function + SPA)
# ================================
[[edge_functions]]
  function = "job"
  path = "/jobs/*"

[[redirects]]
  from = "/jobs/*"
  to = "/jobs.html"
  status = 200
  force = true

# ================================
# BURSARIES (Edge Function + SPA)
# ================================
[[edge_functions]]
  function = "bursary-og"
  path = "/bursary/*"

[[redirects]]
  from = "/bursary/*"
  to = "/bursaries.html"
  status = 200
  force = true

# ================================
# CACHE HEADERS — speeds up SEO
# crawl and improves Core Web Vitals
# ================================

# Static assets: cache 1 year
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# CSS/JS: cache 1 week (you may update these)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML pages: always revalidate (important for fresh SEO content)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sitemap + robots: short cache so Google sees updates fast
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ================================
# PDF EXPORT FUNCTION
# ================================
[functions]
  node_bundler = "esbuild"

[functions."export-pdf"]
  external_node_modules = ["puppeteer-core", "@sparticuz/chromium"]
  memory = 1024
  timeout = 26
# ================================
# FOR AUTONOMUS EMAIL FUNCTION
# ================================

[functions."daily-job-draft"]
  schedule = "0 6,12,18 * * *"

[functions."daily-bursary-draft"]
  schedule = "30 8,17 * * *"
