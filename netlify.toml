# ================================
# BUILD
# ================================
[build]
  publish = "."
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# ================================
# SECURITY + SEO HEADERS
# ================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Permitted-Cross-Domain-Policies = "none"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src blob:; frame-ancestors 'none'; img-src 'self' data: blob: https:; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https:; connect-src 'self' https:; frame-src 'self' blob: https:; form-action 'self' https:; upgrade-insecure-requests"

# ================================
# CANONICAL: /index.html → /
# Prevents duplicate content penalty
# ================================
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Static browser-only admin panels are not safe to expose publicly.
[[redirects]]
  from = "/admin.html"
  to = "/"
  status = 404

[[redirects]]
  from = "/admin-dashboard.html"
  to = "/"
  status = 404

[[redirects]]
  from = "/sanity/*"
  to = "/"
  status = 404

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[edge_functions]]
  function = "home"
  path = "/"

