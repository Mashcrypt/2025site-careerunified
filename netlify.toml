[build]
  publish = "."
  command = "npm run build"

# ================================
# CV GENERATOR (NO REDIRECT LOOPS)
# ================================

# Old page -> new route
[[redirects]]
  from = "/cv-generator.html"
  to = "/cv-generator"
  status = 301
  force = true

# Serve the Vite app for BOTH /cv-generator and /cv-generator/
[[redirects]]
  from = "/cv-generator"
  to = "/cv-generator/index.html"
  status = 200

[[redirects]]
  from = "/cv-generator/"
  to = "/cv-generator/index.html"
  status = 200

# ================================
# JOBS (Edge Function + SPA)
# ================================

# Run the Edge Function for ALL job slugs (Open Graph)
[[edge_functions]]
  function = "job"
  path = "/jobs/*"

# Always serve your main SPA jobs page for any /jobs/<slug>
[[redirects]]
  from = "/jobs/*"
  to = "/jobs.html"
  status = 200
  force = true

# ================================
# BURSARIES
# ================================

[[redirects]]
  from = "/bursary/:slug"
  to = "/bursary/[slug].html"
  status = 200
  force = true

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# ================================
# Pdf export
# ================================
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["puppeteer-core", "@sparticuz/chromium"]

[functions."export-pdf"]
  memory = 1024
  timeout = 26


