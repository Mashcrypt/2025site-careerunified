[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[redirects]]
  from = "/jobs/:slug"
  to = "/jobs/:slug.html"
  status = 200

[[redirects]]
  from = "/bursary/:slug"
  to = "/bursary/:slug.html"
  status = 200



