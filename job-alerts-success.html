<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Job Alerts Subscription | Career Unified</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f1f5f9;
      color: #172033;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(100%, 620px);
      border: 1px solid #dbe3ef;
      border-radius: 8px;
      background: #ffffff;
      padding: clamp(28px, 6vw, 48px);
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    }
    .brand {
      display: inline-block;
      margin-bottom: 28px;
      color: #1e3a8a;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
    }
    h1 {
      margin: 0;
      color: #111827;
      font-size: clamp(1.8rem, 6vw, 2.5rem);
      line-height: 1.15;
    }
    p {
      margin: 16px 0 0;
      color: #4b5563;
      font-size: 1rem;
      line-height: 1.7;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }
    .actions a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      border: 1px solid #1d4ed8;
      border-radius: 6px;
      padding: 10px 18px;
      color: #1d4ed8;
      font-weight: 700;
      text-decoration: none;
    }
    .actions a:first-child {
      background: #1d4ed8;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/">Career Unified</a>
    <h1>You're subscribed</h1>
    <p>Your email was added to the Career Unified job-alert list.</p>
    <div class="actions">
      <a href="/jobs">Browse jobs</a>
      <a href="/">Return home</a>
    </div>
  </main>
  <script src="/js/cookie-notice.js"></script>
</body>
</html>
