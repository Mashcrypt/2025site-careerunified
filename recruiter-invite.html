<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recruiter invitation | Career Unified</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#1e3a8a,#2563eb);font-family:Poppins,sans-serif;color:#111827}.card{width:min(100%,460px);padding:36px;background:#fff;border-radius:16px;box-shadow:0 20px 60px #0004;text-align:center}.card h1{margin:0 0 10px}.card p{color:#667085;line-height:1.6}.card input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d1d5db;border-radius:8px;font:inherit;margin:8px 0}.card button{width:100%;padding:13px;border:0;border-radius:8px;background:#2563eb;color:#fff;font:600 15px Poppins;cursor:pointer;margin-top:10px}.card button:disabled{opacity:.6;cursor:not-allowed}.status{min-height:24px;margin-top:16px}.error{color:#b42318}.success{color:#15803d}
  </style>
</head>
<body>
  <main class="card"><h1>Join your recruiting team</h1><p id="intro">Sign in or create your Career Unified account to accept this invitation.</p><form id="inviteForm"><input id="email" type="email" placeholder="Your email address" autocomplete="email" required><input id="password" type="password" placeholder="Create or enter your password" autocomplete="new-password" minlength="6" required><button id="submit" type="submit">Accept invitation</button></form><p id="status" class="status" aria-live="polite"></p></main>
  <script type="module">
    import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    const app = initializeApp({apiKey:"AIzaSyAEBbnXPlYYf9jbfgLSzfod3r0i5MOAo9M",authDomain:"career-unified.firebaseapp.com",projectId:"career-unified",storageBucket:"career-unified.appspot.com",messagingSenderId:"101656817742",appId:"1:101656817742:web:22c9a58a822a714e54931f6"});
    const auth = getAuth(app), form = document.getElementById("inviteForm"), status = document.getElementById("status"), button = document.getElementById("submit");
    const inviteToken = new URLSearchParams(location.search).get("token") || "";
    form.addEventListener("submit", async event => {
      event.preventDefault(); button.disabled = true; status.className = "status"; status.textContent = "Checking invitation...";
      const email = document.getElementById("email").value.trim().toLowerCase(); const password = document.getElementById("password").value;
      try {
        let credential;
        try { credential = await createUserWithEmailAndPassword(auth, email, password); }
        catch (error) { if (error.code !== "auth/email-already-in-use") throw error; credential = await signInWithEmailAndPassword(auth, email, password); }
        const idToken = await credential.user.getIdToken(true);
        const response = await fetch("/.netlify/functions/recruiter-invite-accept", {method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${idToken}`},body:JSON.stringify({token:inviteToken})});
        const payload = await response.json().catch(() => ({})); if (!response.ok) throw new Error(payload.error || "This invitation could not be accepted.");
        await credential.user.getIdToken(true); status.className = "status success"; status.textContent = "Invitation accepted. Opening your recruiter dashboard..."; setTimeout(() => location.href = "/recruiter-dashboard.html", 700);
      } catch (error) { status.className = "status error"; status.textContent = error.message || "This invitation could not be accepted."; button.disabled = false; }
    });
  </script>
</body>
</html>
