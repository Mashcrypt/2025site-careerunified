<!-- SANITY CLIENT -->
<script src="js/sanityClient.js"></script>

<script>
/* ================================
   GET BURSARY SLUG FROM URL
================================ */
function getBursarySlug() {
  const params = new URLSearchParams(window.location.search);
  return params.get('slug');
}

/* ================================
   UPDATE META TAGS FOR SHARING
================================ */
function updateMetaTags(bursary, imageUrl) {
  const title = `${bursary.name} - Closing ${formatDate(bursary.deadline)}`;
  const description = `${bursary.provider} • ${bursary.faculty} • Apply before ${formatDate(bursary.deadline)}`;
  const url = window.location.href;

  // Page title
  document.title = title;
  document.getElementById('page-title').textContent = title;
  document.getElementById('page-description').setAttribute('content', description);

  // Open Graph
  document.getElementById('og-title').setAttribute('content', title);
  document.getElementById('og-description').setAttribute('content', description);
  document.getElementById('og-url').setAttribute('content', url);
  
  if (imageUrl) {
    document.getElementById('og-image').setAttribute('content', imageUrl);
  }

  // Twitter
  document.getElementById('twitter-title').setAttribute('content', title);
  document.getElementById('twitter-description').setAttribute('content', description);
  
  if (imageUrl) {
    document.getElementById('twitter-image').setAttribute('content', imageUrl);
  }

  // Header
  document.getElementById('header-title').textContent = bursary.name;
}

/* ================================
   FORMAT DATE
================================ */
function formatDate(dateString) {
  const date = new Date(dateString);
  return date.toLocaleDateString('en-ZA', { 
    day: 'numeric', 
    month: 'long', 
    year: 'numeric' 
  });
}

/* ================================
   CHECK IF DEADLINE IS URGENT
================================ */
function isUrgent(deadline) {
  const today = new Date();
  const deadlineDate = new Date(deadline);
  const daysUntil = (deadlineDate - today) / (1000 * 60 * 60 * 24);
  return daysUntil <= 7 && daysUntil > 0;
}

/* ================================
   EXTRACT CLEAN LINK
================================ */
function extractLink(raw) {
  if (!raw) return null;
  if (typeof raw === "string") return raw.trim();
  if (raw.current) return raw.current.trim();
  if (raw.href) return raw.href.trim();
  return null;
}

/* ================================
   RENDER BURSARY DETAILS
================================ */
function renderBursary(bursary) {
  const imageUrl = bursary.providerLogo 
    ? window.sanityClient.imageUrl(bursary.providerLogo).width(400).url()
    : null;

  // Update meta tags for social sharing
  const ogImageUrl = bursary.providerLogo 
    ? window.sanityClient.imageUrl(bursary.providerLogo).width(1200).height(630).fit('crop').url()
    : 'https://careerunified.com/images/social-share-bursaries.png';
  
  updateMetaTags(bursary, ogImageUrl);

  const urgent = isUrgent(bursary.deadline);
  const applicationLink = extractLink(bursary.applicationLink);
  const safeUrl = applicationLink && !applicationLink.startsWith('http') 
    ? 'https://' + applicationLink 
    : applicationLink;

  const content = `
    <div class="bursary-detail-card">
      ${imageUrl ? `<img src="${imageUrl}" alt="${bursary.provider} logo" class="provider-logo">` : ''}
      
      <h1 class="bursary-title">${bursary.name}</h1>
      
      <div class="bursary-meta">
        <div class="meta-item">
          <span class="meta-label">Provider</span>
          <span class="meta-value">${bursary.provider}</span>
        </div>
        
        <div class="meta-item">
          <span class="meta-label">Faculty</span>
          <span class="meta-value">${bursary.faculty}</span>
        </div>
        
        <div class="meta-item">
          <span class="meta-label">Closing Date</span>
          <span class="meta-value">
            ${formatDate(bursary.deadline)}
            ${urgent ? '<span class="deadline-urgent">Closing Soon</span>' : ''}
          </span>
        </div>
      </div>
      
      <div class="description-section">
        <h3>About This Bursary</h3>
        <div class="description-content">${bursary.description}</div>
      </div>
      
      <div class="action-buttons">
        ${safeUrl 
          ? `<a href="${safeUrl}" class="apply-btn" target="_blank" rel="noopener noreferrer">Apply Now</a>`
          : `<p class="no-link-msg">No application link provided</p>`
        }
        <button class="share-btn" onclick="shareOnWhatsApp()">Share on WhatsApp</button>
      </div>
    </div>
  `;

  document.getElementById('bursaryContent').innerHTML = content;
}

/* ================================
   SHARE ON WHATSAPP
================================ */
function shareOnWhatsApp() {
  const url = window.location.href;
  const text = encodeURIComponent(`Check out this bursary opportunity on Career Unified: ${url}`);
  window.open(`https://wa.me/?text=${text}`, '_blank');
}

/* ================================
   FETCH BURSARY BY SLUG
================================ */
async function fetchBursaryBySlug(slug) {
  try {
    const query = `*[_type=="bursary" && slug.current=="${slug}"][0]{
      _id,
      name,
      provider,
      faculty,
      description,
      deadline,
      applicationLink,
      providerLogo,
      "slug": slug.current
    }`;

    const bursary = await window.sanityClient.fetch(query);

    if (!bursary) {
      throw new Error('Bursary not found');
    }

    renderBursary(bursary);

  } catch (error) {
    console.error('Error fetching bursary:', error);
    document.getElementById('bursaryContent').innerHTML = `
      <div class="error-message">
        <h2>Bursary Not Found</h2>
        <p>Sorry, we couldn't find the bursary you're looking for.</p>
        <a href="bursaries.html" class="apply-btn" style="margin-top: 20px; display: inline-block;">Back to All Bursaries</a>
      </div>
    `;
  }
}

/* ================================
   INITIALIZE
================================ */
const slug = getBursarySlug();

if (!slug) {
  document.getElementById('bursaryContent').innerHTML = `
    <div class="error-message">
      <h2>Invalid URL</h2>
      <p>No bursary specified.</p>
      <a href="bursaries.html" class="apply-btn" style="margin-top: 20px; display: inline-block;">Back to All Bursaries</a>
    </div>
  `;
} else {
  fetchBursaryBySlug(slug);
}
</script>
