<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Browse Jobs | CareerUnified</title>
<meta name="description" content="Browse verified South African jobs. Filter by category, search companies and apply directly.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/css/jobs.css">

<style>
body { margin:0; font-family:Arial,sans-serif; background:#f5f7fb }
.container { display:flex; height:100vh }
.sidebar { width:40%; background:white; border-right:1px solid #ddd; overflow-y:auto }
.preview { width:60%; padding:30px; overflow-y:auto }
.job-card { padding:15px; border-bottom:1px solid #eee; cursor:pointer }
.job-card:hover { background:#f0f4ff }
.job-card.selected { background:#eaf0ff }
.company { color:#555 }
.meta { font-size:13px; color:#777 }
.apply-btn { background:#0b5cff; color:white; padding:12px 20px; display:inline-block; margin-top:15px; border-radius:6px; text-decoration:none }
.share-btn { display:inline-block; margin-left:10px; color:#25d366; font-weight:bold; text-decoration:none }
.filters { padding:15px; border-bottom:1px solid #eee; display:flex; gap:10px }
input,select { padding:10px; width:100% }
</style>
</head>

<body>

<div class="container">

  <!-- LEFT -->
  <div class="sidebar">

    <div class="filters">
      <input id="jobSearch" placeholder="Search jobs or companies">
      <select id="categoryFilter">
        <option value="all">All categories</option>
        <option value="IT">IT</option>
        <option value="Finance">Finance</option>
        <option value="Marketing">Marketing</option>
        <option value="Admin">Admin</option>
      </select>
    </div>

    <ul id="jobList"></ul>

  </div>

  <!-- RIGHT -->
  <div class="preview" id="jobPreview">
    <h2>Click a job to view details</h2>
  </div>

</div>

<script type="module">

import { sanityClient } from "./js/sanityClient.js";

let jobs = [];
let views = JSON.parse(localStorage.getItem("jobViews")) || {};
let selectedIndex = null;

const jobList = document.getElementById("jobList");
const jobPreview = document.getElementById("jobPreview");
const searchInput = document.getElementById("jobSearch");
const categoryFilter = document.getElementById("categoryFilter");

// =============================
// FETCH JOBS FROM SANITY
// =============================
async function fetchJobs() {
  const query = `
  *[_type=="job"] | order(posted desc){
    _id,
    title,
    "slug": slug.current,
    description,
    location,
    salary,
    applyLink,
    category,
    posted,
    deadline,
    company->{
      name
    }
  }`;

  jobs = await sanityClient.fetch(query);
  renderJobs();
}

// =============================
// RENDER LIST
// =============================
function renderJobs() {
  const term = searchInput.value.toLowerCase();
  const cat = categoryFilter.value;

  const filtered = jobs.filter(j => {
    const company = j.company?.name || "";
    return (
      (cat === "all" || j.category === cat) &&
      (
        j.title.toLowerCase().includes(term) ||
        company.toLowerCase().includes(term) ||
        j.description.toLowerCase().includes(term)
      )
    );
  });

  jobList.innerHTML = "";

  filtered.forEach((job, i) => {
    if (!views[job._id]) views[job._id] = 0;

    const li = document.createElement("li");
    li.className = "job-card" + (i === selectedIndex ? " selected" : "");

    li.innerHTML = `
      <h3>${job.title}</h3>
      <div class="company">${job.company?.name || "Unknown company"}</div>
      <div class="meta">${job.location || "South Africa"}</div>
      <div class="meta">${views[job._id]} views</div>
      <a href="/jobs/${job.slug}" target="_blank">View job →</a>
    `;

    li.onclick = () => {
      selectedIndex = i;
      views[job._id]++;
      localStorage.setItem("jobViews", JSON.stringify(views));
      showPreview(job);
      renderJobs();
    };

    jobList.appendChild(li);
  });
}

// =============================
// PREVIEW
// =============================
function showPreview(job) {
  jobPreview.innerHTML = `
    <h2>${job.title}</h2>
    <div class="company">${job.company?.name || ""}</div>
    <p><b>Location:</b> ${job.location}</p>
    <p><b>Salary:</b> ${job.salary || "Market related"}</p>
    <p><b>Closing:</b> ${job.deadline || "Open"}</p>
    <hr>
    <div style="white-space:pre-line">${job.description}</div>

    <a class="apply-btn" href="${job.applyLink}" target="_blank">Apply Now</a>

    <a class="share-btn" target="_blank"
      href="https://wa.me/?text=${encodeURIComponent("Apply here: https://careerunified.com/jobs/" + job.slug)}">
      Share
    </a>
  `;
}

searchInput.addEventListener("input", renderJobs);
categoryFilter.addEventListener("change", renderJobs);

fetchJobs();

</script>

</body>
</html>
