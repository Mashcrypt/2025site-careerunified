<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,follow">
  <title>Apply on Career Unified</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2Z934XRVXT"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-2Z934XRVXT");
  </script>
  <style>
    *{box-sizing:border-box}
    html,body{max-width:100%;overflow-x:hidden}
    body{margin:0;background:#f4f7fc;color:#111827;font-family:Poppins,Arial,sans-serif;line-height:1.5}
    a{color:#1d4ed8}
    .apply-header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #e8edf6}
    .header-inner{width:min(1180px,calc(100% - 32px));min-height:68px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px;min-width:0}
    .brand{display:inline-flex;align-items:center;gap:10px;color:#111827;text-decoration:none;font-weight:700;font-size:1.1rem;white-space:nowrap}
    .brand-logo{width:34px;height:34px;display:block;flex:0 0 34px;border-radius:6px;object-fit:cover}
    .back-link{display:inline-flex;align-items:center;min-height:40px;padding:0 8px;color:#374151;text-decoration:none;font-weight:600;font-size:.9rem;white-space:nowrap;flex-shrink:0}
    .back-link:hover,.back-link:focus-visible{color:#1d4ed8}
    .apply-layout{width:min(1180px,calc(100% - 32px));margin:28px auto 56px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start;min-width:0}
    .apply-panel,.job-summary{background:#fff;border:1px solid #dbeafe;border-radius:8px;box-shadow:0 10px 30px rgba(30,58,138,.08);min-width:0}
    .apply-panel{padding:28px}
    .job-summary{padding:22px;position:sticky;top:20px}
    .eyebrow{margin:0 0 6px;color:#2563eb;font-size:.78rem;font-weight:800;text-transform:uppercase}
    h1{margin:0;color:#1e3a8a;font-size:clamp(1.55rem,3vw,2.15rem);line-height:1.2}
    h2{margin:0 0 16px;color:#1e3a8a;font-size:1.08rem}
    h3{margin:0;color:#1e3a8a;font-size:1.05rem}
    .intro{margin:10px 0 0;color:#64748b}
    .step{padding:26px 0;border-top:1px solid #e5e7eb}
    .step:first-of-type{margin-top:24px}
    .step-title{display:flex;align-items:center;gap:10px;margin-bottom:18px}
    .step-number{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#dbeafe;color:#1e3a8a;font-weight:800;font-size:.85rem}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .field{display:grid;gap:7px}
    .field.full{grid-column:1/-1}
    label,.field-label{font-weight:700;font-size:.87rem;color:#374151}
    .required{color:#dc2626}
    input,select,textarea{width:100%;min-height:46px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;padding:11px 12px;color:#111827;font:inherit;font-size:.92rem}
    .picker-combobox{position:relative}
    .picker-combobox input{padding-right:48px}
    .picker-toggle{position:absolute;top:50%;right:6px;display:grid;width:36px;height:36px;padding:0;transform:translateY(-50%);place-items:center;border:0;border-radius:6px;background:transparent;color:#475569;cursor:pointer}
    .picker-toggle:hover,.picker-toggle:focus-visible{background:#eff6ff;color:#1e3a8a}
    .picker-suggestions{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:25;max-height:280px;overflow:auto;border:1px solid #dbe5f0;border-radius:10px;background:#fff;box-shadow:0 16px 36px rgba(15,23,42,.12)}
    .picker-suggestion{display:grid;width:100%;padding:12px 14px;border:0;border-bottom:1px solid #eef2f7;background:#fff;color:#1f2937;text-align:left;cursor:pointer}
    .picker-suggestion:last-child{border-bottom:0}
    .picker-suggestion:hover,.picker-suggestion:focus-visible,.picker-suggestion.is-active{background:#eff6ff;color:#1e3a8a}
    .picker-suggestion strong{font-size:.9rem;font-weight:700}
    .picker-suggestion span{margin-top:2px;color:#64748b;font-size:.78rem}
    .choice-grid{display:flex;flex-wrap:wrap;gap:8px}
    .choice-pill{display:inline-flex;align-items:center;min-height:40px;cursor:pointer}
    .choice-pill input{position:absolute;opacity:0;pointer-events:none}
    .choice-pill span{display:inline-flex;align-items:center;min-height:40px;padding:9px 12px;border:1px solid #cbd5e1;border-radius:999px;background:#fff;color:#334155;font-size:.86rem;font-weight:600;transition:border-color .16s ease,background .16s ease,color .16s ease}
    .choice-pill input:checked + span{border-color:#2563eb;background:#eff6ff;color:#1e3a8a}
    .choice-pill input:focus-visible + span{outline:3px solid rgba(37,99,235,.16);outline-offset:2px}
    textarea{min-height:130px;resize:vertical}
    input:focus,select:focus,textarea:focus{outline:3px solid rgba(37,99,235,.16);border-color:#2563eb}
    .help{margin:0;color:#64748b;font-size:.78rem}
    .cv-upload{margin-top:12px;padding:16px;border:1px dashed #93c5fd;border-radius:6px;background:#eff6ff}
    .question-list{display:grid;gap:18px;min-width:0}
    .question{padding:16px;background:#f8fbff;min-width:0}
    .question.conditional-question{background:#f0fdfa}
    .question.conditional-question[hidden]{display:none}
    .checks{display:grid;gap:12px}
    .check{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;color:#374151;font-size:.86rem;min-width:0}
    .check input{width:18px;height:18px;min-height:0;margin:2px 0 0}
    .submit-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:22px}
    .primary-btn{border:0;border-radius:8px;background:#2563eb;color:#fff;padding:14px 22px;font:inherit;font-weight:800;cursor:pointer;min-width:220px;box-shadow:0 10px 24px rgba(37,99,235,.18);transition:background .16s ease,transform .16s ease,box-shadow .16s ease}
    .primary-btn:hover{background:#1d4ed8;transform:translateY(-1px);box-shadow:0 14px 28px rgba(29,78,216,.22)}
    .primary-btn:disabled{cursor:not-allowed;opacity:.65}
    .status{display:none;margin:18px 0 0;padding:14px 16px;border-radius:6px;font-weight:600;font-size:.9rem}
    .status.show{display:block}
    .status.error{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}
    .status.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
    .status.success{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
    .summary-company{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .company-logo{width:48px;height:48px;border:1px solid #dbeafe;border-radius:6px;object-fit:contain;background:#fff}
    .summary-title{font-size:1.08rem;font-weight:800;color:#1e3a8a;line-height:1.35}
    .summary-meta{display:grid;gap:12px;margin-top:18px}
    .summary-meta div{padding-top:12px;border-top:1px solid #e5e7eb}
    .summary-meta span{display:block;color:#64748b;font-size:.74rem;font-weight:700;text-transform:uppercase}
    .summary-meta strong{display:block;margin-top:3px;color:#1f2937;font-size:.9rem}
    .trust{margin:20px 0 0;padding:14px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;color:#166534;font-size:.78rem}
    .auth-gate{text-align:center;padding:40px 20px}
    .auth-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}
    .auth-actions a{display:inline-flex;padding:12px 18px;border-radius:6px;text-decoration:none;font-weight:700}
    .auth-actions .login{background:#2563eb;color:#fff}
    .auth-actions .signup{border:1px solid #bfdbfe;background:#eff6ff}
    .success-view{text-align:center;padding:42px 14px}
    .success-mark{width:58px;height:58px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#dcfce7;color:#15803d;font-size:1.8rem;font-weight:800}
    .success-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px}
    .success-actions a{padding:12px 17px;border-radius:6px;text-decoration:none;font-weight:700}
    .success-actions .applications-link{background:#1e3a8a;color:#fff}
    .skeleton{height:16px;border-radius:4px;background:#e5e7eb;animation:pulse 1.2s infinite alternate}
    @keyframes pulse{to{opacity:.45}}
    @media(max-width:820px){
      .apply-layout{grid-template-columns:1fr;margin-top:16px}
      .job-summary{position:static;grid-row:1}
      .apply-panel{grid-row:2}
    }
    @media(max-width:560px){
      .header-inner,.apply-layout{width:min(100% - 20px,1180px)}
      .header-inner{gap:12px}
      .brand{gap:8px;font-size:1rem;min-width:0}
      .brand span{overflow:hidden;text-overflow:ellipsis}
      .brand-logo{width:32px;height:32px;flex-basis:32px}
      .back-link{padding:0;font-size:.8rem}
      .apply-panel,.job-summary{padding:18px}
      .grid{grid-template-columns:1fr}
      .field.full{grid-column:auto}
      .submit-row{align-items:stretch;flex-direction:column}
      .primary-btn{width:100%}
      .choice-grid{gap:6px}
      .choice-pill{max-width:100%}
      .choice-pill span{max-width:100%;white-space:normal;text-align:left}
    }
  </style>
</head>
<body>
  <header class="apply-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Career Unified home">
        <img class="brand-logo" src="/android-chrome-192x192.png" alt="" width="34" height="34">
        <span>Career Unified</span>
      </a>
      <a class="back-link" id="backToJob" href="/jobs">Back to jobs</a>
    </div>
  </header>

  <main class="apply-layout">
    <section class="apply-panel" id="applicationPanel" aria-live="polite">
      <p class="eyebrow">Career Unified Direct Apply</p>
      <h1>Preparing your application</h1>
      <p class="intro">Loading your profile and application details.</p>
      <div style="display:grid;gap:12px;margin-top:28px">
        <div class="skeleton" style="width:72%"></div>
        <div class="skeleton" style="width:100%"></div>
        <div class="skeleton" style="width:88%"></div>
      </div>
    </section>

    <aside class="job-summary" id="jobSummary" aria-label="Job summary">
      <div class="skeleton" style="width:55%;margin-bottom:16px"></div>
      <div class="skeleton" style="width:100%;margin-bottom:10px"></div>
      <div class="skeleton" style="width:82%"></div>
    </aside>
  </main>

  <script type="module" src="/js/direct-apply.js?v=20260828-1"></script>
  <script src="/js/cookie-notice.js"></script>
</body>
</html>
