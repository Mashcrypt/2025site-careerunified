<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Successful • Career Unified</title>
    <style>
      body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:#f8fafc; }
      .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
      .card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:28px; max-width:520px; width:100%; box-shadow: 0 1px 2px rgba(0,0,0,.05); text-align:center; }
      h1 { margin:0; font-size:24px; color:#0f172a; }
      p { margin:12px 0 0; color:#475569; line-height:1.5; }
      .btns { margin-top:18px; display:flex; flex-direction:column; gap:10px; }
      a { display:inline-flex; align-items:center; justify-content:center; padding:12px 14px; border-radius:12px; text-decoration:none; font-weight:600; }
      .primary { background:#2563eb; color:#fff; }
      .primary:hover { background:#1d4ed8; }
      .ghost { border:1px solid #e2e8f0; color:#0f172a; background:#fff; }
      .ghost:hover { background:#f1f5f9; }
      .small { font-size:12px; color:#64748b; margin-top:16px; }
      .badge { display:inline-block; margin-bottom:10px; font-size:12px; color:#0f766e; background:#ecfdf5; border:1px solid #a7f3d0; padding:4px 10px; border-radius:999px; font-weight:600; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="badge">Payment Confirmed</div>
        <h1>Payment successful </h1>
        <p>Your subscription is now active. You can start using AI features immediately.</p>

        <div class="btns">
          <a class="primary" href="/cv-generator/">Continue to Resume Builder</a>
          <a class="ghost" href="/">Go to Home</a>
        </div>

        <p class="small">
          If your AI tools still look locked, wait a few seconds and refresh — Paystack webhooks can take a moment.
        </p>
      </div>
    </div>
  </body>
</html>
